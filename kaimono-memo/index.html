<title>買い物メモ</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700&family=Noto+Sans+JP:wght@400;500;700&display=swap">
<style>
/* Layout: 1-column phone notepad. Sticky header with 3 tabs, one list per tab, add bar at the bottom of each list. */
:root{
  --bg:#f2f5f0; --card:#ffffff; --ink:#1c2b24; --muted:#66756d; --line:#dbe3dc;
  --accent:#2c7a58; --accent-ink:#ffffff; --sale:#d4412f; --sale-bg:#fdeceb; --done:#9aa8a0;
  --font-display:'Zen Maru Gothic','Noto Sans JP',sans-serif;
  --font-body:'Noto Sans JP',system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#121a16; --card:#1b2621; --ink:#e6eee9; --muted:#93a39a; --line:#2c3a33;
  --accent:#4fb887; --accent-ink:#0c1812; --sale:#ff7d6b; --sale-bg:#3a2320; --done:#62736a; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#121a16; --card:#1b2621; --ink:#e6eee9; --muted:#93a39a; --line:#2c3a33;
  --accent:#4fb887; --accent-ink:#0c1812; --sale:#ff7d6b; --sale-bg:#3a2320; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:16px;line-height:1.5;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 48px}
.wrap{max-width:560px;margin:0 auto}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:10}
header{position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);z-index:9;padding-top:16px}
h1{font-family:var(--font-display);font-size:1.35rem;margin:0 0 12px;display:flex;justify-content:space-between;align-items:baseline;gap:12px}
h1 small{font-family:var(--font-body);font-size:.75rem;font-weight:400;color:var(--muted)}
.tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;border-bottom:2px solid var(--line)}
.tab{font:inherit;font-weight:500;background:none;border:0;color:var(--muted);padding:10px 4px;cursor:pointer;
  border-bottom:3px solid transparent;margin-bottom:-2px;display:flex;flex-direction:column;align-items:center;line-height:1.25}
.tab span.n{font-size:.72rem;font-weight:400}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent);font-weight:700}
.tab.sale[aria-selected="true"]{border-bottom-color:var(--sale)}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
main{padding-top:16px}
.hint{color:var(--muted);font-size:.85rem;margin:0 0 12px}
ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
li.row{background:var(--card);border:1px solid var(--line);border-radius:10px;display:flex;align-items:center;gap:4px;padding:2px 4px 2px 0}
.chk{flex:none;width:48px;height:48px;display:grid;place-items:center;background:none;border:0;cursor:pointer}
.box{width:24px;height:24px;border:2px solid var(--muted);border-radius:6px;display:grid;place-items:center;color:transparent;font-size:15px;font-weight:700}
.done .box{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.txt{flex:1;min-width:0;overflow-wrap:anywhere;padding:8px 0}
.done .txt{color:var(--done);text-decoration:line-through}
.ibtn{flex:none;font:inherit;font-size:.78rem;background:none;border:1px solid var(--line);color:var(--muted);border-radius:999px;padding:6px 10px;cursor:pointer;white-space:nowrap}
.ibtn:hover{color:var(--ink);border-color:var(--muted)}
.x{flex:none;width:40px;height:40px;background:none;border:0;color:var(--muted);font-size:1.3rem;cursor:pointer;border-radius:8px}
.x:hover{color:var(--sale)}
.add{display:flex;gap:8px;margin-top:16px}
input[type=text]{font:inherit;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px 14px;min-width:0;width:100%}
input[type=text]::placeholder{color:var(--muted);opacity:.8}
.add input{flex:1}
.chips .lbl{font-size:.75rem;color:var(--muted);margin-bottom:4px}
.chip-row{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:999px;background:var(--bg);overflow:hidden}
.chip-b{font:inherit;font-size:.85rem;color:var(--ink);background:none;border:0;padding:8px 6px 8px 12px;cursor:pointer}
.chip-x{font:inherit;font-size:.9rem;color:var(--muted);background:none;border:0;padding:8px 10px 8px 4px;cursor:pointer}
.chip-x:hover{color:var(--sale)}
.preview{font-size:.82rem;color:var(--muted);margin:8px 2px 0;min-height:1.3em;overflow-wrap:anywhere}
.btn{font:inherit;font-weight:700;background:var(--accent);color:var(--accent-ink);border:0;border-radius:10px;padding:12px 18px;cursor:pointer;white-space:nowrap}
.btn.sale{background:var(--sale);color:#fff}
.empty{text-align:center;color:var(--muted);padding:28px 8px;border:1.5px dashed var(--line);border-radius:12px;font-size:.9rem}
.clear{margin-top:16px;text-align:right}
.link{font:inherit;font-size:.85rem;background:none;border:0;color:var(--muted);text-decoration:underline;cursor:pointer;padding:8px}
/* sale */
.store{margin:20px 0 8px;font-family:var(--font-display);font-weight:700;font-size:1rem;display:flex;align-items:center;gap:8px}
.store::before{content:"";width:10px;height:10px;border-radius:3px;background:var(--sale)}
.sale-row{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 4px 10px 14px;display:flex;gap:8px;align-items:center}
.sale-main{flex:1;min-width:0}
.sale-name{font-weight:500;overflow-wrap:anywhere}
.price{font-family:var(--font-display);font-weight:700;color:var(--sale);background:var(--sale-bg);border-radius:6px;padding:0 8px;margin-left:8px;white-space:nowrap;display:inline-block}
.when{font-size:.82rem;color:var(--muted);margin-top:2px;overflow-wrap:anywhere}
.sale-row.expired{opacity:.5}
.sale-row.expired .sale-name{text-decoration:line-through}
.sale-row.expired .price{background:none;color:var(--muted)}
.sale-form{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:16px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px}
.sale-form .full{grid-column:1/-1}
.sale-form label{font-size:.75rem;color:var(--muted);display:block;margin-bottom:2px}
.sale-form .btn{grid-column:1/-1}
.status{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(12px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);font-size:.8rem;padding:6px 14px;border-radius:999px;opacity:0;transition:opacity .2s;pointer-events:none}
.status.show{opacity:.9}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
@media (max-width:380px){.sale-form{grid-template-columns:1fr}}
</style>

<div class="wrap">
  <header>
    <h1>買い物メモ <small id="today"></small></h1>
    <div class="tabs" role="tablist">
      <button class="tab" role="tab" id="tab-today" data-tab="today">今日買う<span class="n" id="n-today"></span></button>
      <button class="tab" role="tab" id="tab-next" data-tab="next">次回買う<span class="n" id="n-next"></span></button>
      <button class="tab sale" role="tab" id="tab-sale" data-tab="sale">セール品<span class="n" id="n-sale"></span></button>
    </div>
  </header>
  <main id="main"></main>
</div>
<div class="status" id="status" role="status"></div>

<script>
(function(){
  var KEY='kaimono-memo-v1';
  var state={today:[],next:[],sale:[],stores:[]};
  var tab='today';
  try{var t=localStorage.getItem('kaimono-tab');if(t)tab=t}catch(e){}
  var docRef=null, saving=false, dirty=false, timer=null, loaded=false;

  function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,6)}
  function el(tag,cls,text){var e=document.createElement(tag);if(cls)e.className=cls;if(text!=null)e.textContent=text;return e}
  /* 「牛乳と豚肉とヨーグルト」「卵、パン」「牛乳 卵」や改行を1品ずつに分ける */
  function splitItems(s){
    var t=s.replace(/[\r\n、,，;；]+/g,'|').replace(/[\s　]+/g,'|').replace(/([^|])と(?=[^|])/g,'$1|');
    return t.split('|').map(function(x){return x.trim()}).filter(Boolean);
  }
  /* 「今日から明日まで」→「11/28(土)〜11/29(日)」。追加した日の日付に変えて保存する */
  var OFFSET={'今日':0,'本日':0,'きょう':0,'明日':1,'あした':1,'あす':1,'明後日':2,'あさって':2,'明々後日':3,'しあさって':3};
  function dayLabel(n){var x=new Date();x.setDate(x.getDate()+n);return (x.getMonth()+1)+'/'+x.getDate()+'('+'日月火水木金土'[x.getDay()]+')'}
  function resolveWhen(s){
    var hit=false;
    var t=s.replace(/明々後日|しあさって|明後日|あさって|明日|あした|あす|今日|本日|きょう/g,function(w){hit=true;return dayLabel(OFFSET[w])});
    if(!hit)return s;
    /* 「AからBまで」は「A〜B」にする */
    return t.replace(/(\d+\/\d+\([^)]+\))\s*から\s*(\d+\/\d+\([^)]+\))\s*まで/g,'$1〜$2').replace(/から/g,'〜');
  }
  /* いつ欄の最後の日付を終了日とみなし、今日より前なら期限切れ。年は追加時に until として保存 */
  function parseEnd(text,base){
    var re=/(\d{1,2})\/(\d{1,2})/g,m,list=[];
    while((m=re.exec(text||''))){list.push([+m[1],+m[2]])}
    if(!list.length)return null;
    var first=list[0],last=list[list.length-1],y=base.getFullYear();
    var endYear=(last[0]<first[0]||(last[0]===first[0]&&last[1]<first[1]))?y+1:y;
    return new Date(endYear,last[0]-1,last[1]);
  }
  function isExpired(s){
    var today=new Date();today.setHours(0,0,0,0);
    var end=null;
    if(s.until){var p=s.until.split('-');end=new Date(+p[0],+p[1]-1,+p[2])}
    else end=parseEnd(s.when,today);
    return !!end&&end<today;
  }
  function ymd(x){return x.getFullYear()+'-'+(x.getMonth()+1)+'-'+x.getDate()}
  /* 音声入力などで「鶏もも肉 ウジエスーパー 150円 今日から明日まで」を品名欄にまとめて入れたとき、項目ごとに振り分ける */
  var DAY='(?:明々後日|明後日|あさって|明日|あした|あす|今日|本日|きょう|\\d{1,2}\\/\\d{1,2})(?:\\([^)]*\\))?';
  var RE_WHEN=new RegExp('('+DAY+'(?:\\s*(?:から|〜|~|～)\\s*'+DAY+')?(?:\\s*(?:まで|だけ|限定))?|毎週[月火水木金土日]曜日?|毎日|週末|土日)');
  var UNIT='(?:パック|個|本|袋|枚|匹|玉|束|切れ|kg|g|グラム|キロ|ml|リットル)';
  var RE_PRICE=new RegExp('((?:\\d+\\s*'+UNIT+'\\s*(?:あたり|で)?\\s*)?\\d[\\d,]*\\s*円(?:\\s*(?:税込|税抜))?)');
  var RE_STORE=/([^\s、,がはでのを]*?(?:スーパーマーケット|ドラッグストア|スーパー|ストア|マート|マーケット|ドラッグ|薬局|市場|生協|コープ|ヨーカドー|イオン|ドンキ|ホームセンター|商店|食品館|鮮魚店|肉屋))/;
  /* お店の名前を覚えておく（新しく使った順）。候補とパース補助に使う */
  function knownStores(){var seen={},list=[];(state.stores||[]).concat(state.sale.map(function(s){return s.store})).forEach(function(n){if(n&&!seen[n]){seen[n]=1;list.push(n)}});return list}
  function rememberStore(name){state.stores=[name].concat((state.stores||[]).filter(function(n){return n!==name})).slice(0,20)}
  function parseSale(raw,known){
    var t=raw.normalize('NFKC').replace(/(\d{1,2})月(\d{1,2})日/g,'$1/$2'),out={item:'',store:'',price:'',when:''},m;
    if((m=t.match(RE_WHEN))){out.when=m[1].trim();t=t.replace(m[0],' ')}
    if((m=t.match(RE_PRICE))){out.price=m[1].replace(/\s+/g,'');t=t.replace(m[0],' ')}
    var kn=null,kk='';(known||[]).forEach(function(n){var k=n.normalize('NFKC');if(k&&t.indexOf(k)>=0&&k.length>kk.length){kn=n;kk=k}});
    if((m=kn?[kk,kn]:t.match(RE_STORE))){out.store=kn||m[1];t=t.replace(m[0]+'では',' ').replace(m[0]+'で',' ').replace(m[0]+'の',' ').replace(m[0]+'は',' ').replace(m[0],' ')}
    t=t.replace(/(特売|セール|お買い得|安い|です)/g,' ').replace(/\s+/g,' ').trim();
    out.item=t.replace(/^[がはをでの、,\s]+|[がはをでの、,\s]+$/g,'').trim();
    out.hit=!!(out.when||out.price||out.store);
    return out;
  }
  function norm(s){s=s||{};return {today:Array.isArray(s.today)?s.today:[],next:Array.isArray(s.next)?s.next:[],sale:Array.isArray(s.sale)?s.sale:[],stores:Array.isArray(s.stores)?s.stores:[]}}

  var d=new Date(), wd='日月火水木金土'[d.getDay()];
  document.getElementById('today').textContent=(d.getMonth()+1)+'/'+d.getDate()+'('+wd+')';

  var statusEl=document.getElementById('status'), st;
  function flash(msg){statusEl.textContent=msg;statusEl.classList.add('show');clearTimeout(st);st=setTimeout(function(){statusEl.classList.remove('show')},1600)}

  /* ---- storage: db when available (per-person, private), else this browser ---- */
  function localLoad(){try{return norm(JSON.parse(localStorage.getItem(KEY)))}catch(e){return norm()}}
  function localSave(){try{localStorage.setItem(KEY,JSON.stringify(state))}catch(e){}}

  function persist(){
    localSave();
    if(!docRef) return;
    dirty=true; clearTimeout(timer);
    timer=setTimeout(flush,400);
  }
  function flush(){
    if(saving){timer=setTimeout(flush,200);return}
    if(!dirty) return;
    saving=true; dirty=false;
    docRef.set(JSON.parse(JSON.stringify(state))).catch(function(){flash('保存できませんでした。この端末には保存済みです')}).then(function(){saving=false;if(dirty)flush()});
  }

  /* ---- render ---- */
  function setCounts(){
    var open=function(a){return a.filter(function(i){return !i.done}).length};
    document.getElementById('n-today').textContent=open(state.today)+'件';
    document.getElementById('n-next').textContent=open(state.next)+'件';
    document.getElementById('n-sale').textContent=state.sale.length+'件';
  }
  function render(){
    setCounts();
    ['today','next','sale'].forEach(function(k){
      var b=document.getElementById('tab-'+k);b.setAttribute('aria-selected',String(k===tab))});
    var main=document.getElementById('main');
    var focusId=document.activeElement&&document.activeElement.id;
    var val=focusId&&document.activeElement.value;
    main.textContent='';
    if(tab==='sale') renderSale(main); else renderList(main,tab);
    if(focusId){var f=document.getElementById(focusId);if(f){f.focus();if(val!=null&&f.value===''&&val)f.value=val}}
  }

  function renderList(main,k){
    var other=k==='today'?'next':'today';
    main.appendChild(el('p','hint',k==='today'?'今日のお買い物リスト。買ったらチェック。':'次にお出かけしたときに買いたいものをためておく場所です。'));
    var items=state[k];
    if(!items.length){
      main.appendChild(el('div','empty',k==='today'?'まだ何もありません。下の欄に「牛乳」「卵」のように入れてください。':'次回の買い物メモはまだありません。思いついたらここに入れておきます。'));
    }else{
      var ul=el('ul');
      items.forEach(function(it){
        var li=el('li','row'+(it.done?' done':''));
        var c=el('button','chk');c.setAttribute('aria-label',it.t+(it.done?' を未購入に戻す':' を購入済みにする'));
        c.appendChild(el('span','box','✓'));
        c.onclick=function(){it.done=!it.done;persist();render()};
        li.appendChild(c);
        li.appendChild(el('div','txt',it.t));
        var mv=el('button','ibtn',k==='today'?'次回へ':'今日へ');
        mv.onclick=function(){state[k]=state[k].filter(function(x){return x!==it});it.done=false;state[other].unshift(it);persist();render();flash(k==='today'?'次回リストへ移動':'今日のリストへ移動')};
        li.appendChild(mv);
        var x=el('button','x','×');x.setAttribute('aria-label',it.t+' を削除');
        x.onclick=function(){state[k]=state[k].filter(function(y){return y!==it});persist();render()};
        li.appendChild(x);
        ul.appendChild(li);
      });
      main.appendChild(ul);
      if(items.some(function(i){return i.done})){
        var cl=el('div','clear');var b=el('button','link','チェック済みをまとめて消す');
        b.onclick=function(){state[k]=state[k].filter(function(i){return !i.done});persist();render()};
        cl.appendChild(b);main.appendChild(cl);
      }
    }
    var form=el('form','add');
    var inp=el('input');inp.type='text';inp.id='add-'+k;inp.autocomplete='off';inp.placeholder=k==='today'?'例：牛乳と豚肉とヨーグルト':'例：洗剤と電池';inp.setAttribute('aria-label','追加する品物');
    var btn=el('button','btn','追加');btn.type='submit';
    form.appendChild(inp);form.appendChild(btn);
    var pv=el('div','preview');pv.setAttribute('aria-live','polite');
    function showPv(){var p=splitItems(inp.value);pv.textContent=p.length>1?p.length+'件に分けて追加：'+p.join(' / '):(p.length?'':'「と」「、」やスペースで区切ると、まとめて入力できます')}
    inp.oninput=showPv;showPv();
    form.onsubmit=function(e){e.preventDefault();var p=splitItems(inp.value);if(!p.length)return;p.forEach(function(v){state[k].push({id:uid(),t:v,done:false})});persist();inp.value='';render();document.getElementById('add-'+k).focus();if(p.length>1)flash(p.length+'件追加しました')};
    main.appendChild(form);main.appendChild(pv);
  }

  function renderSale(main){
    main.appendChild(el('p','hint','チラシを見ながら、どこのお店でいつ何が安いかをメモします。'));
    var items=state.sale;
    if(!items.length){
      main.appendChild(el('div','empty','セール情報はまだありません。下のフォームから入れてください。'));
    }else{
      var groups={};items.forEach(function(s){var n=s.store||'お店未入力';(groups[n]=groups[n]||[]).push(s)});
      var allOld=function(n){return groups[n].every(isExpired)};
      Object.keys(groups).sort(function(a,b){return (allOld(a)-allOld(b))||(a<b?-1:a>b?1:0)}).forEach(function(name){
        groups[name].sort(function(a,b){return isExpired(a)-isExpired(b)});
        main.appendChild(el('div','store',name));
        var ul=el('ul');
        groups[name].forEach(function(s){
          var old=isExpired(s);
          var li=el('li','sale-row'+(old?' expired':''));
          var m=el('div','sale-main');
          var n=el('div','sale-name',s.item);
          if(s.price)n.appendChild(el('span','price',s.price));
          m.appendChild(n);
          if(s.when||old)m.appendChild(el('div','when','🗓 '+(s.when||'')+(old?'（期限切れ）':'')));
          li.appendChild(m);
          var add=el('button','ibtn','今日買う');
          add.hidden=old;
          add.setAttribute('aria-label',s.item+' を今日のリストに入れる');
          add.onclick=function(){
            var label=s.item+(s.store?'（'+s.store+(s.price?' '+s.price:'')+'）':'');
            state.today.push({id:uid(),t:label,done:false});persist();render();flash('今日のリストに追加しました')};
          li.appendChild(add);
          var x=el('button','x','×');x.setAttribute('aria-label',s.item+' を削除');
          x.onclick=function(){state.sale=state.sale.filter(function(y){return y!==s});persist();render()};
          li.appendChild(x);
          ul.appendChild(li);
        });
        main.appendChild(ul);
      });
    }
    if(items.some(isExpired)){
      var cl=el('div','clear');var cb=el('button','link','期限切れのセールをまとめて消す');
      cb.onclick=function(){state.sale=state.sale.filter(function(s){return !isExpired(s)});persist();render()};
      cl.appendChild(cb);main.appendChild(cl);
    }
    var form=el('form','sale-form');
    function field(id,label,ph,full){
      var w=el('div',full?'full':'');var l=el('label',null,label);l.htmlFor=id;
      var i=el('input');i.type='text';i.id=id;i.placeholder=ph;i.autocomplete='off';
      w.appendChild(l);w.appendChild(i);form.appendChild(w);return i}
    var fItem=field('s-item','品名','例：鶏もも肉',true);
    var fStore=field('s-store','お店','例：サンマート');
    var fPrice=field('s-price','値段','例：1パック198円');
    var fWhen=field('s-when','いつ','例：今日から明日まで、毎週火曜',true);
    var chipsBox=el('div','full chips');form.appendChild(chipsBox);
    function drawChips(){
      chipsBox.textContent='';var ks=knownStores().slice(0,12);if(!ks.length)return;
      chipsBox.appendChild(el('div','lbl','お店の候補（タップで入力）'));
      var row=el('div','chip-row');
      ks.forEach(function(n){
        var w=el('span','chip');
        var b=el('button','chip-b',n);b.type='button';b.onclick=function(){fStore.value=n;showSale();fStore.focus()};
        var x=el('button','chip-x','×');x.type='button';x.setAttribute('aria-label',n+' を候補から消す');
        x.onclick=function(){state.stores=(state.stores||[]).filter(function(y){return y!==n});persist();drawChips()};
        w.appendChild(b);w.appendChild(x);row.appendChild(w)});
      chipsBox.appendChild(row);
    }
    drawChips();
    var pv=el('div','preview full');pv.setAttribute('aria-live','polite');form.appendChild(pv);
    function auto(){return !fStore.value.trim()&&!fPrice.value.trim()&&!fWhen.value.trim()?parseSale(fItem.value,knownStores()):null}
    function showSale(){var p=auto();pv.textContent=p&&p.hit?'こう分けて登録します：品名「'+p.item+'」 お店「'+p.store+'」 値段「'+p.price+'」 いつ「'+resolveWhen(p.when)+'」':'品名欄に「鶏もも肉 ウジエスーパー 150円 今日から明日まで」とまとめて入れても、自動で分けます'}
    fItem.oninput=showSale;fStore.oninput=showSale;fPrice.oninput=showSale;fWhen.oninput=showSale;showSale();
    var btn=el('button','btn sale','セール情報を追加');btn.type='submit';form.appendChild(btn);
    form.onsubmit=function(e){e.preventDefault();
      var p=auto(),f=(p&&p.hit)?p:{item:fItem.value.trim(),store:fStore.value.trim(),price:fPrice.value.trim(),when:fWhen.value.trim()};
      var item=f.item;if(!item){fItem.focus();return}
      var when=resolveWhen(f.when);
      state.sale.push({id:uid(),item:item,store:f.store,price:f.price,when:when,until:(function(e){return e?ymd(e):''})(parseEnd(when,new Date()))});
      if(f.store)rememberStore(f.store);
      persist();render();flash('セール情報を追加しました')};
    main.appendChild(form);
  }

  document.querySelectorAll('.tab').forEach(function(b){
    b.onclick=function(){tab=b.dataset.tab;try{localStorage.setItem('kaimono-tab',tab)}catch(e){}render()}});

  /* first paint from this browser, then switch to the synced copy */
  state=localLoad();render();

  (async function(){
    try{
      var user=await claude.use('user'), db=await claude.use('db');
      if(!user||!db)return;
      var id=await user.id(); if(!id)return;
      docRef=db.doc('data/users/'+id+'/memo');
      var timeout=setTimeout(function(){if(!loaded)flash('同期できていません。この端末の内容を表示中')},10000);
      docRef.onSnapshot(function(snap){
        if(snap.fromCache===false){loaded=true;clearTimeout(timeout)}
        if(saving||dirty)return;
        if(snap.exists){
          var remote=norm(JSON.parse(JSON.stringify(snap.data())));/* snapshot is frozen: work on a copy */
          if(JSON.stringify(remote)!==JSON.stringify(state)){state=remote;localSave();render()}
        }else if(snap.fromCache===false){
          /* first time on the server: upload what this browser already has */
          var has=state.today.length||state.next.length||state.sale.length;
          if(has){dirty=true;flush()}
        }
      },function(){flash('同期できませんでした。この端末に保存します')});
    }catch(e){}
  })();
})();
</script>
