<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>カタクチ商店 受発注システム</title>
<link rel="icon" href="icons/icon-192.png?v=202607311434" type="image/png">
<link rel="apple-touch-icon" href="icons/icon-192.png?v=202607311434">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="カタクチ商店 受発注">
<meta name="theme-color" content="#0d6b58">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root {
    --primary: #0d6b58;
    --primary-dark: #0a5545;
    --bg: #f7f7f5;
    --card-bg: #ffffff;
    --border: #e2e2de;
    --text: #2a2a28;
    --hint: #767671;
    --danger: #c0392b;
    --success: #1e7a3d;
    --warning: #9a6400;
    --warning-bg: #fbf1dc;
    --internal: #6b3fa0;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Yu Gothic", sans-serif;
    background: var(--bg);
    color: var(--text);
  }
  .page {
    max-width: 640px;
    margin: 0 auto;
    padding: 20px 16px 60px;
  }
  .page.wide {
    max-width: 880px;
  }
  h1 {
    font-size: 22px;
    margin: 8px 0 4px;
  }
  h2 {
    font-size: 16px;
    margin: 0 0 12px;
  }
  h2.section-title {
    margin: 24px 4px 8px;
    padding-top: 4px;
    border-top: 2px solid var(--primary);
    padding-top: 12px;
  }
  h2.section-title:first-child {
    margin-top: 4px;
    border-top: none;
    padding-top: 0;
  }
  .hint {
    color: var(--hint);
    font-size: 13px;
    line-height: 1.6;
  }
  .admin-back-link {
    margin: 0 0 8px;
  }
  .admin-back-link a {
    font-size: 13px;
    color: var(--primary);
    text-decoration: none;
    font-weight: 600;
  }
  .card {
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 16px;
    margin: 16px 0;
  }
  .grand-total-card {
    background: #e6f4ee;
    border: 2px solid var(--primary);
  }
  .grand-total-card h2 {
    color: var(--primary-dark);
  }
  .grand-total-card .oyster-qty {
    font-size: 26px;
  }
  .stock-forecast {
    font-size: 13.5px;
    color: var(--warning);
    background: var(--warning-bg);
    border-radius: 8px;
    padding: 8px 10px;
    margin: 10px 0 0;
    line-height: 1.6;
  }
  .calendar-header {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 16px;
    margin-bottom: 8px;
  }
  .calendar-header h2 {
    margin: 0;
    min-width: 110px;
    text-align: center;
  }
  .cal-nav-btn {
    width: auto;
    padding: 6px 14px;
    font-size: 15px;
    font-weight: 700;
    border: 1px solid var(--border);
    border-radius: 8px;
    background: #fff;
    color: var(--primary);
    cursor: pointer;
  }
  .stock-calendar {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    gap: 4px;
  }
  .view-toggle {
    display: flex;
    gap: 8px;
    margin-bottom: 12px;
  }
  .view-toggle-btn {
    flex: 1;
    padding: 9px 6px;
    font-size: 13px;
    font-weight: 700;
    border: 1px solid var(--border);
    border-radius: 8px;
    background: #fff;
    color: var(--hint);
    cursor: pointer;
  }
  .stock-subnav a.view-toggle-btn {
    text-decoration: none;
    text-align: center;
  }
  .view-toggle-btn.active {
    border-color: var(--primary);
    color: var(--primary);
    background: #e3f0ec;
  }
  .stock-calendar > .cal-list-wrap {
    grid-column: 1 / -1;
  }
  .cal-list-wrap {
    overflow-x: auto;
  }
  .cal-list-table {
    width: 100%;
    border-collapse: collapse;
    font-size: 12px;
  }
  .cal-list-table th,
  .cal-list-table td {
    border-bottom: 1px solid var(--border);
    padding: 6px 6px;
    text-align: left;
    vertical-align: top;
    white-space: nowrap;
  }
  .cal-list-table th {
    color: var(--hint);
    font-weight: 700;
    font-size: 11px;
  }
  .cal-list-table td {
    white-space: normal;
  }
  .cal-list-date {
    font-weight: 700;
    white-space: nowrap !important;
  }
  .cal-list-today td {
    background: #e3f0ec;
  }
  .cal-list-line {
    display: flex;
    align-items: baseline;
    justify-content: flex-start;
    color: var(--text);
    line-height: 1.7;
    white-space: nowrap;
  }
  .cal-list-line .cal-deluse-btn,
  .cal-list-line .cal-del-btn {
    margin-left: 4px;
  }
  .cal-list-line-label {
    color: var(--hint);
    margin-left: 4px;
  }
  .supplier-breakdown-table th:not(:first-child),
  .supplier-breakdown-table td:not(:first-child) {
    text-align: right;
  }
  .supplier-breakdown-total td {
    font-weight: 700;
    border-top: 2px solid var(--border);
  }
  .supplier-breakdown-unknown td {
    color: var(--hint);
  }
  .cal-breakdown {
    font-size: 11px;
    color: var(--text);
    line-height: 1.5;
  }
  .cal-breakdown-line {
    font-weight: 700;
    margin-top: 4px;
  }
  .cal-breakdown-line:first-child {
    margin-top: 0;
  }
  .cal-breakdown-sub {
    padding-left: 10px;
    color: var(--hint);
    font-weight: 400;
  }
  .audit-old {
    color: var(--hint);
    text-decoration: line-through;
  }
  .audit-op {
    font-weight: 700;
    white-space: nowrap;
  }
  .audit-op-insert {
    color: var(--success);
  }
  .audit-op-update {
    color: var(--warning);
  }
  .audit-op-delete {
    color: var(--danger);
  }
  .cal-weekday {
    font-size: 11px;
    font-weight: 700;
    color: var(--hint);
    text-align: center;
    padding: 2px 0 6px;
  }
  .cal-cell {
    min-height: 58px;
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 3px 4px;
    font-size: 10.5px;
    line-height: 1.35;
  }
  .cal-cell.cal-empty {
    border-color: transparent;
  }
  .cal-cell.cal-today {
    border-color: var(--primary);
    border-width: 2px;
  }
  .cal-daynum {
    font-size: 12px;
    font-weight: 700;
    color: var(--text);
    margin-bottom: 1px;
  }
  .cal-in {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 2px;
    color: var(--success);
  }
  .cal-out {
    color: var(--danger);
  }
  .cal-use {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 2px;
    color: var(--internal);
  }
  .cal-del-btn,
  .cal-deluse-btn {
    border: none;
    background: none;
    color: var(--hint);
    cursor: pointer;
    font-size: 11px;
    padding: 0 2px;
    line-height: 1;
  }
  .cal-out-clickable,
  .cal-use-clickable {
    cursor: pointer;
  }
  .cal-out-clickable:hover,
  .cal-use-clickable:hover {
    text-decoration: underline;
  }
  .cal-warn {
    color: var(--danger);
    font-weight: 700;
  }
  .cal-warn-clickable,
  .cal-selfwarn-clickable {
    cursor: pointer;
  }
  .cal-warn-clickable:hover,
  .cal-selfwarn-clickable:hover {
    text-decoration: underline;
  }
  .cal-day-clickable {
    cursor: pointer;
  }
  .cal-day-clickable:hover {
    text-decoration: underline;
    color: var(--primary);
  }
  .day-row-actions {
    white-space: nowrap;
  }
  .day-row-actions button {
    margin-right: 6px;
  }
  .form-edit-banner {
    font-size: 13px;
    color: var(--primary-dark);
    background: #e3f0ec;
    border-radius: 8px;
    padding: 8px 10px;
    margin: 4px 0 10px;
  }
  .btn-plain {
    width: 100%;
    padding: 11px;
    font-size: 14px;
    font-weight: 600;
    border: 1px solid var(--border);
    border-radius: 10px;
    background: #fff;
    color: var(--text);
    cursor: pointer;
    margin-top: 8px;
  }
  .btn-plain:disabled {
    opacity: 0.5;
  }
  .stock-out-row {
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 10px 10px 2px;
    margin-bottom: 10px;
  }
  .stock-out-row .bo-remove {
    color: var(--danger);
    border-color: var(--danger);
  }
  .range-calendar .cal-cell {
    min-height: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 8px 0;
  }
  .range-calendar .cal-daynum {
    margin: 0;
    font-size: 13px;
    font-weight: 500;
  }
  .cal-cell.cal-pickable {
    cursor: pointer;
  }
  .cal-cell.cal-pickable:hover {
    border-color: var(--primary);
  }
  .cal-cell.cal-range-mid {
    background: #e3f0ec;
    border-radius: 0;
  }
  .cal-cell.cal-range-start,
  .cal-cell.cal-range-end {
    background: var(--primary);
    border-color: var(--primary);
  }
  .cal-cell.cal-range-start .cal-daynum,
  .cal-cell.cal-range-end .cal-daynum {
    color: #fff;
    font-weight: 700;
  }
  .field {
    margin-bottom: 14px;
  }
  .field-row {
    display: flex;
    gap: 12px;
    flex-wrap: wrap;
  }
  .field-row .field {
    flex: 1;
    min-width: 90px;
  }
  label {
    display: block;
    font-size: 13px;
    color: var(--hint);
    margin-bottom: 6px;
  }
  input, textarea, select {
    width: 100%;
    font-size: 16px;
    padding: 10px 12px;
    border: 1px solid var(--border);
    border-radius: 10px;
    background: #fff;
    color: var(--text);
    font-family: inherit;
  }
  input[type="number"], select {
    text-align: center;
    text-align-last: center;
  }
  input[type="date"] {
    width: 100%;
    max-width: 100%;
    padding-left: 8px;
    padding-right: 8px;
    box-sizing: border-box;
  }
  .field-kg {
    text-align: center;
    font-size: 20px;
    font-weight: 700;
    color: var(--primary);
    margin-top: 6px;
  }
  input:disabled, textarea:disabled, select:disabled {
    background: #f0f0ec;
    color: var(--hint);
  }
  textarea {
    resize: vertical;
  }
  .checkbox-label {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 14px;
    color: var(--text);
    margin-bottom: 14px;
    cursor: pointer;
  }
  .checkbox-label input[type="checkbox"] {
    width: 18px;
    height: 18px;
    flex: none;
  }
  button.primary {
    width: 100%;
    padding: 13px;
    font-size: 16px;
    font-weight: 600;
    color: #fff;
    background: var(--primary);
    border: none;
    border-radius: 10px;
    cursor: pointer;
  }
  button.primary:active {
    background: var(--primary-dark);
  }
  button.primary:disabled {
    opacity: 0.6;
  }
  button.secondary {
    width: 100%;
    padding: 12px;
    font-size: 14px;
    font-weight: 600;
    color: var(--danger);
    background: #fff;
    border: 1px solid var(--danger);
    border-radius: 10px;
    cursor: pointer;
    margin-top: 8px;
  }
  button.secondary:disabled {
    opacity: 0.5;
  }
  .msg {
    min-height: 20px;
    font-size: 13px;
    margin-top: 10px;
  }
  .msg-success, .msg-error {
    font-size: 15px;
    font-weight: 700;
    padding: 10px 12px;
    border-radius: 8px;
  }
  .msg-success { color: var(--success); background: #e6f4ea; }
  .msg-error { color: var(--danger); background: #fbe9e7; }
  .deadline-msg {
    font-size: 13px;
    color: var(--warning);
    background: var(--warning-bg);
    border-radius: 8px;
    padding: 8px 10px;
    margin-bottom: 14px;
  }
  .home-links {
    list-style: none;
    padding: 0;
    margin: 0;
  }
  .home-links li {
    border-bottom: 1px solid var(--border);
  }
  .home-links li:last-child {
    border-bottom: none;
  }
  .home-links a {
    display: block;
    padding: 12px 4px;
    color: var(--primary);
    text-decoration: none;
    font-weight: 500;
  }
  .date-group {
    margin-bottom: 18px;
  }
  .date-group:last-child {
    margin-bottom: 0;
  }
  .date-heading {
    font-size: 15px;
    font-weight: 700;
    color: var(--text);
    margin: 0 0 4px;
    padding-bottom: 4px;
    border-bottom: 2px solid var(--primary);
  }
  .recent-list {
    list-style: none;
    padding: 0;
    margin: 0;
  }
  .recent-list li {
    padding: 10px 4px;
    border-bottom: 1px solid var(--border);
  }
  .recent-list li:last-child {
    border-bottom: none;
  }
  .recent-list li.clickable {
    cursor: pointer;
  }
  .recent-list li.clickable:active {
    background: #f0f0ec;
  }
  .recent-date {
    display: block;
    font-size: 15px;
    font-weight: 700;
    color: var(--text);
    margin-bottom: 4px;
  }
  .recent-store {
    font-size: 15px;
    font-weight: 700;
    color: var(--text);
  }
  .shop-haiso-juchu .recent-store {
    display: block;
    font-size: 20px;
  }
  .recent-submitted {
    display: block;
    font-size: 12.5px;
    font-weight: 400;
    color: var(--hint);
    margin-top: 2px;
  }
  .recent-kg {
    display: block;
    font-size: 12.5px;
    font-weight: 400;
    color: var(--hint);
    margin-top: 2px;
  }
  .recent-body {
    display: block;
    font-size: 15.5px;
    font-weight: 700;
    line-height: 1.6;
  }
  .oyster-qty {
    display: block;
    font-size: 22px;
    font-weight: 700;
    color: var(--primary);
    line-height: 1.5;
  }
  .confirm-badge {
    display: inline-block;
    font-size: 12.5px;
    font-weight: 700;
    padding: 3px 8px;
    border-radius: 999px;
    margin-top: 6px;
  }
  .confirm-badge.confirmed {
    color: var(--success);
    background: #e6f4ea;
  }
  .confirm-badge.pending {
    color: var(--hint);
    background: #f0f0ec;
  }
  .courier-tag {
    display: inline-block;
    font-size: 11px;
    font-weight: 700;
    padding: 2px 7px;
    border-radius: 999px;
    margin-left: 6px;
    color: #8a5a00;
    background: #fff3d6;
    vertical-align: middle;
  }
  .recent-list li.courier-total {
    opacity: 0.75;
    padding-top: 2px;
  }
  .recent-list li.courier-total .recent-date {
    font-size: 13px;
    font-weight: 400;
  }
  .recent-list li.courier-total .oyster-qty {
    font-size: 17px;
  }
  .confirm-btn {
    display: inline-block;
    width: auto;
    font-size: 12.5px;
    font-weight: 700;
    padding: 5px 10px;
    margin-top: 6px;
    border-radius: 999px;
    border: 1px solid var(--primary);
    background: #fff;
    color: var(--primary);
    cursor: pointer;
  }
  .confirm-btn:disabled {
    opacity: 0.6;
  }
  .unconfirm-btn {
    display: inline-block;
    width: auto;
    font-size: 12.5px;
    font-weight: 700;
    padding: 5px 10px;
    margin-top: 6px;
    border-radius: 999px;
    border: 1px solid var(--border);
    background: #fff;
    color: var(--hint);
    cursor: pointer;
  }
  .unconfirm-btn:disabled {
    opacity: 0.6;
  }
  .print-btn {
    display: inline-block;
    width: auto;
    font-size: 12.5px;
    font-weight: 700;
    padding: 5px 10px;
    margin-top: 6px;
    border-radius: 999px;
    border: 1px solid var(--primary);
    background: #fff;
    color: var(--primary);
    cursor: pointer;
  }
  .table-tools {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
    margin-bottom: 10px;
  }
  .print-table-btn, .excel-export-btn {
    display: inline-block;
    width: auto;
    font-size: 12.5px;
    font-weight: 700;
    padding: 5px 10px;
    border-radius: 999px;
    border: 1px solid var(--primary);
    background: #fff;
    color: var(--primary);
    cursor: pointer;
  }
  .table-scroll {
    overflow-x: auto;
    margin: 0 -4px;
  }
  .agg-table {
    border-collapse: collapse;
    width: 100%;
    font-size: 13px;
  }
  .agg-table th, .agg-table td {
    border: 1px solid var(--border);
    padding: 6px 8px;
    text-align: center;
    white-space: nowrap;
  }
  .agg-table thead th {
    background: #f0f0ec;
    font-weight: 700;
    color: var(--text);
  }
  .agg-table .row-label {
    text-align: left;
    font-weight: 700;
    background: #fafaf8;
    position: sticky;
    left: 0;
  }
  .agg-table tbody tr:nth-child(even) td:not(.row-label) {
    background: #fafaf8;
  }
  .agg-table .subtotal {
    font-weight: 700;
    color: var(--primary);
  }
  .agg-table .grand {
    font-weight: 700;
    color: var(--primary);
    background: #eef6f2;
  }
  .agg-table tfoot td {
    background: #f0f0ec;
    font-weight: 700;
  }
  .agg-table .cell-empty {
    color: var(--hint);
  }
</style>
</head>
<body>
<div id="app"></div>
<script src="storage.js?v=202608270751"></script>
<script src="app.js?v=202608270751"></script>
</body>
</html>
